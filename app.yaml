kind: wasmer.io/App.v0
owner: etopat2
name: citycare-medical-centre
package: .
debug: false
env:
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  LOG_CHANNEL: stderr
  VIEW_COMPILED_PATH: /tmp

locality:
  regions:
    - fr-roub1

scaling:
  mode: single_concurrency

capabilities:
  database:
    engine: mysql

volumes:
  - name: citycare-profile-photos
    mount: /app/storage/app/private

health_checks:
  - http:
      method: get
      path: /
      interval: 30s
      timeout: 10s
      unhealthy_threshold: 2
      healthy_threshold: 1
      expected_status_codes:
        - 200

jobs:
  - name: migrate-database
    trigger: pre-deployment
    timeout: 10m
    action:
      execute:
        command: php
        cli_args:
          - /app/artisan
          - wasmer:prepare
