<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f3d3e">
    <title>Offline · CityCare Medical Centre</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: #f2f8f7; color: #163b3d; font: 16px/1.6 system-ui, sans-serif; }
        main { width: min(100%, 30rem); padding: 2rem; border: 1px solid #d7e5e3; border-radius: 1.25rem; background: white; box-shadow: 0 16px 40px rgb(15 61 62 / 10%); text-align: center; }
        .mark { width: 4rem; height: 4rem; margin: 0 auto 1rem; }
        h1 { margin: 0; font-size: 1.4rem; }
        p { margin: .75rem 0 1.25rem; color: #53696a; }
        a { display: inline-block; padding: .7rem 1rem; border-radius: .7rem; background: #0f766e; color: white; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img class="mark" src="/favicon.svg" alt="">
        <h1>You’re offline</h1>
        <p>CityCare needs an internet connection to load appointments, visit records, and payments. Reconnect and try again.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
